name: Products Functions - Swap staging to production

on:
  workflow_dispatch:

jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap staging -> production
        run: >
          az functionapp deployment slot swap
          --resource-group quartile-assessment
          --name func-quartile-products-leo
          --slot staging
          --target-slot production