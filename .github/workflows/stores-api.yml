# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - app-quartile-stores-leo

on:
  push:
    branches:
      - 'main'
    paths:
      - 'stores/**'
      - '.github/workflows/stores-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: stores

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Unit tests
        run: dotnet test tests/Stores.UnitTests -c Release --no-build

      - name: Start LocalDB
        run: sqllocaldb start MSSQLLocalDB

      - name: Integration tests
        run: dotnet test tests/Stores.IntegrationTests -c Release --no-build

      - name: dotnet publish
        run: dotnet publish src/Stores.Api/Stores.Api.csproj -c Release --no-build -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_69FFBC9B4CB04196956A143DC1C0C209 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7FD6D36E24EE4F95ADC8DA3C7E843197 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_501FEA6BCEF94A0C83BF8CD83AE30604 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-quartile-stores-leo'
          slot-name: 'Production'
          package: .
          